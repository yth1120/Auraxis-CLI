name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:practical
      - run: npm run e2e:app-server
      - run: npm run e2e:sdk
      - run: npm run build:single -w @auraxis/cli
      - run: npm run pack:check
      - run: npm run build:native:all
      - name: Upload native binaries
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/native/*
          generate_release_notes: true
      - name: Publish @auraxis/core to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish -w @auraxis/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @auraxis/cli to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish -w @auraxis/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Note npm publish status
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          echo "::warning::NPM_TOKEN 未配置，已跳过 npm 发布；GitHub Release 与原生二进制已正常上传。"
          echo "配置仓库 Secret NPM_TOKEN（npm Automation token）后重跑本 workflow 即可发布 npm 包。"
