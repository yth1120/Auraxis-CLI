name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动补发：按 package.json 的当前版本创建或更新对应的 Release。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:practical
      - run: npm run e2e:app-server
      - run: npm run e2e:sdk
      - run: npm run build:single -w @auraxis/cli
      - run: npm run pack:check
      - run: npm run build:native:all
      - name: Resolve release tag
        id: release_tag
        run: echo "tag=v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      - name: Upload native binaries
        uses: softprops/action-gh-release@v2
        # 该 action 在上传数百 MB 资产时偶发被 GitHub 返回 HTML 错误页，
        # 失败不阻断后续的 gh CLI 兜底上传。
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: packages/cli/native/*
          generate_release_notes: true
          fail_on_unmatched_files: false
      - name: Re-upload binaries with gh (robust overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$tag" packages/cli/native/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish to npm (skipped without NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN 未配置，已跳过 npm 发布；GitHub Release 与原生二进制已正常上传。"
            echo "配置仓库 Secret NPM_TOKEN（npm Automation token）后重跑本 workflow 即可发布 npm 包。"
            exit 0
          fi
          npm publish -w @auraxis/core
          npm publish -w @auraxis/cli
