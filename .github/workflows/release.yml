name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:practical
      - run: npm run e2e:app-server
      - run: npm run e2e:sdk
      - run: npm run build:single -w @auraxis/cli
      - run: npm run pack:check
      - run: npm run build:native:all
      - run: npm publish -w @auraxis/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @auraxis/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload native binaries
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/native/*
          generate_release_notes: true
