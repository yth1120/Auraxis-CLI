name: Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动补发：按 package.json 的当前版本创建或更新对应的 Release。
  workflow_dispatch:

permissions:
  contents: write
  # npm Trusted Publishing（OIDC）：发布时用短时令牌换取发布权限，
  # 配置好 Trusted Publisher 后即可删除 NPM_TOKEN，无需长期凭据。
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:practical
      - run: npm run e2e:app-server
      - run: npm run e2e:sdk
      - run: npm run build:single -w @auraxis/cli
      - run: npm run pack:check
      - run: npm run build:native:all
      - name: Resolve release tag
        id: release_tag
        run: echo "tag=v$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")" >> "$GITHUB_OUTPUT"
      # npm 发布放在资产上传之前：资产上传偶发被 GitHub 侧 500 拒绝，
      # 不应因此让 npm 包发不出去。
      - name: Publish to npm (OIDC, falls back to NPM_TOKEN)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm $(npm --version) / node $(node --version)"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "使用 NPM_TOKEN 发布（首次发布占位，之后应切换到 Trusted Publishing）"
          else
            echo "未配置 NPM_TOKEN，尝试使用 Trusted Publishing（OIDC）发布"
          fi
          npm publish -w @auraxis/core
          npm publish -w @auraxis/cli
      # 用官方 gh CLI 上传，并对 GitHub 侧的瞬时 5xx 做重试。
      - name: Upload native binaries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag 已存在，覆盖上传资产"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
          for attempt in 1 2 3; do
            echo "第 $attempt 次上传资产…"
            if gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber packages/cli/native/*; then
              echo "资产上传完成"
              exit 0
            fi
            echo "::warning::第 $attempt 次上传失败，30 秒后重试"
            sleep 30
          done
          echo "::error::资产上传连续失败，请稍后重跑本 workflow 补传"
          exit 1
